<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papa</title>
  <style>
    :root { --cream:#FAF8F5; --navy:#1B2D45; --slate:#4A5A72; --mist:#9AAABB; --border:#EDE8E0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--cream); color: var(--slate);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 80px 28px 120px; }
    .eyebrow { font-size: 11px; letter-spacing: 6px; font-weight: 700; color: var(--mist); text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-size: 48px; line-height: 1.1; color: var(--navy); margin: 18px 0 14px; }
    .rule { width: 36px; height: 2px; background: var(--navy); margin: 18px 0 28px; border-radius: 1px; }
    .lede { font-size: 18px; line-height: 1.6; color: var(--slate); }
    .links { display: flex; gap: 28px; margin-top: 36px; }
    .links a {
      color: var(--navy); text-decoration: none; font-weight: 600; font-size: 15px;
      border-bottom: 2px solid var(--navy); padding-bottom: 2px;
    }
    .footer { margin-top: 80px; color: var(--mist); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">PAPA</div>
    <h1>A weekly companion for first-time dads.</h1>
    <div class="rule"></div>
    <p class="lede">
      Papa is an iOS app that walks first-time fathers through pregnancy, birth,
      and the first three months — week by week, with honest writing and
      country-specific practical guidance.
    </p>
    <div class="links">
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
    </div>
    <div class="footer">
      Made with love in Amsterdam. © 2026 Papa.
    </div>
  </div>
</body>
</html>
